name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
      - name: 平台零容忍守卫(core 依赖清单不得出现任何宿主 SDK)
        run: |
          ! grep -qE '"@trimjs/|"@qnap|"@synology|"@ugreen|"@terramaster' package.json || {
            echo "::error::core 依赖清单出现宿主 SDK——平台代码属于壳仓,禁止进入 core"
            exit 1
          }
          ! grep -rqE "from '@trimjs|from \"@trimjs" src/ || {
            echo "::error::core 源码 import 了宿主 SDK——平台代码属于壳仓"
            exit 1
          }
      - name: 构建(先生成 components.d.ts 再全量类型检查)
        run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: neutral 产物平台代码扫描(命中即红)
        run: |
          if grep -rloE "trimjs|pickSharedFile|fnosSsoLogin|trim_open_gateway" dist/assets/ >/dev/null 2>&1; then
            echo "::error::neutral 构建产物出现平台代码"
            exit 1
          fi
