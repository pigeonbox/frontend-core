name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: npm ci
      - name: 平台零容忍守卫(core 依赖清单不得出现任何宿主 SDK)
        run: |
          ! grep -qE '"@trimjs/|"@qnap|"@synology|"@ugreen|"@terramaster' package.json || {
            echo "::error::core 依赖清单出现宿主 SDK——平台代码属于壳仓,禁止进入 core"
            exit 1
          }
          ! grep -rqE "from '@trimjs|from \"@trimjs" src/ || {
            echo "::error::core 源码 import 了宿主 SDK——平台代码属于壳仓"
            exit 1
          }
      - name: 构建(先生成 components.d.ts 再全量类型检查)
        run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: neutral 产物平台代码扫描(命中即红)
        run: |
          if grep -rloE "trimjs|pickSharedFile|fnosSsoLogin|trim_open_gateway" dist/assets/ >/dev/null 2>&1; then
            echo "::error::neutral 构建产物出现平台代码"
            exit 1
          fi

  typecheck-latest:
    name: 类型检查（最新 vue-tsc，前瞻探针）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: npm ci
      # 2026-10-30 实录：frontend-core 以**源码 tgz** 被 fnos/openwrt/qnap 消费，
      # 三个平台的 `web/` 把 node_modules/@pigeonbox/frontend-core/src/** 一起纳入
      # 自己的 vue-tsc 类型检查 ⇒ **库的类型检查结论 = 消费方的类型检查结论**。
      # 本轮 vue-tsc 3.3.14 对 `<script setup>` 里 reactive() 绑定的 v-model 嵌套成员
      # 误生成 `.value` 访问（TS2339 ×20）⇒ 三个消费方 typecheck 全红、4.4.0 列车终验
      # 被挡；而库自己因为锁在 3.2.5 **CI 假绿** ⇒ 这类漂移永远由消费方先发现。
      # ⇒ 本 job 用**最新 vue-tsc** 跑一遍库自己的类型检查：上游工具链一出回归，
      #    **库这边先红**，而不是等消费方红（钉版只是止血，探针才是防线）。
      # ⚠️ typescript **钉在本仓地板**（5.9.3）：探针的信号要**只**来自 vue-tsc。
      #    若让它浮动，TS 6 的新弃用项（如 baseUrl）会把信号淹在噪声里
      #    ——2026-10-30 首跑就踩到：npx 自带的 TS 6 报 TS5101（baseUrl 废弃），
      #    而那**不是**代码问题。本仓已顺手去掉 baseUrl（paths 改相对写法），
      #    等 TS 抬地板时零改动。
      - name: 用最新 vue-tsc 跑类型检查（TS 钉本仓地板）
        run: npx --yes -p vue-tsc@latest -p typescript@5.9.3 vue-tsc --noEmit -p tsconfig.app.json
