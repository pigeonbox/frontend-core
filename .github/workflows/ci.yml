name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # action pin 门禁（frontend-core#90）：判据脚本为 hub pigeonbox/pigeonbox
      # scripts/check-action-pins.sh 的本仓副本（scripts/ 下，头部有同步注记）。
      # 断言挂在 pull_request 路径上（放别处 = 漏网 pin 已进 main 才报）。
      # --remote 用 GitHub API 验每个 pin 真是合法 commit（抓「全仓一致地打错」）；
      # --selfcheck 注入坏 pin（tag/矛盾 SHA/零 pin）必须判红，证明门禁有牙齿。
      - name: action pin 必须全是合法 commit（格式+一致性+远端校验）
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-action-pins.sh --remote
      - name: action pin 门禁自证（注入坏 pin 必须判红）
        run: bash scripts/check-action-pins.sh --selfcheck
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      # npm 漏洞门禁（frontend-core#92 建、#127 改判据）：与 Go 侧 govulncheck 同级。
      # ⚠️ 必须显式官方 registry：npmmirror 对 /-/npm/v1/security/* 返回 404
      #    ⇒ 任何默认走镜像源的 CI/本地审计都会**静默拿不到数据**（假绿）。
      #    --package-lock-only 只读锁文件，不依赖 node_modules。
      # 判据 = **可动作性**（frontend-core#127）：
      #   ① high/critical 且公告归属包**自身有补丁可升** ⇒ 判红（能消除就必须消除）；
      #   ② high/critical 且归属包**无补丁可升**（上游未出修复，公告范围覆盖全部已发布
      #     版本）⇒ 必须在 security/audit-unfixable.json **显式登记**（带跟踪单号与
      #     复核日期）⇒ 未登记即判红。
      # 为什么要分层：picomatch ≤4.0.7 的 ReDoS 公告（GHSA-fc5q-39xc-vjpf，
      # first_patched_version=null ⇒ 无补丁可升）自 2026-11-17 起让原「有 high 就红」
      # 变成**恒红**——恒红门禁形同虚设，还会连带拖红生态 CI 基线闸门 ⇒ 列车发不出车。
      # 判据能自愈：上游一出补丁版，npm 的 fixAvailable 指向本包 ⇒ 自动回到 ① ⇒ 转红。
      - name: npm 漏洞门禁(可修复高危判红 + 无补丁高危须显式登记, 显式官方 registry)
        run: bash scripts/audit-gate.sh
      # 判据自身的负对照（6 项，纯本地不联网）：可修复必红 / 本包有补丁必红 /
      # 未登记必红 / npm 只建议升依赖方时仍走登记判据 / 已登记放行 / 无高危放行。
      - name: npm 漏洞门禁判据自证(6 项负对照)
        run: bash scripts/audit-gate.sh --selfcheck
      # 负对照自证（frontend-core#92）：把 immutable 钉回漏洞区间 5.1.5 后同一条
      # 命令必须判红——仍绿 = 恒绿摆设。在临时目录里做，不碰工作区锁文件。
      - name: npm 漏洞门禁自证(immutable 钉回 5.1.5 必须判红)
        run: |
          tmp="$(mktemp -d)"
          cp package.json package-lock.json "$tmp"/
          node -e '
            const fs = require("fs");
            const p = process.argv[1];
            const lock = JSON.parse(fs.readFileSync(p, "utf8"));
            lock.packages["node_modules/immutable"] = {
              version: "5.1.5",
              resolved: "https://registry.npmjs.org/immutable/-/immutable-5.1.5.tgz",
              integrity: "sha512-t7xcm2siw+hlUM68I+UEOK+z84RzmN59as9DZ7P1l0994DKUWV7UXBMQZVxaoMSRQ+PBZbHCOoBt7a2wxOMt+A==",
              devOptional: true,
              license: "MIT",
            };
            fs.writeFileSync(p, JSON.stringify(lock, null, 2) + "\n");
          ' "$tmp/package-lock.json"
          if (cd "$tmp" && npm audit --package-lock-only --audit-level=high --registry=https://registry.npmjs.org); then
            echo "::error::负对照未转红: immutable 钉回 5.1.5 后 npm audit 仍放行, 门禁是恒绿摆设"
            exit 1
          fi
          echo "负对照通过: 钉回 5.1.5 即判红"
      # 抬版门禁（frontend-core#96）：库线内容一变先抬自己的版本——package.json
      # 有 diff 而 VERSION 未抬 ⇒ 红（依赖/契约变更必须与抬版同 PR 落地，
      # 否则列车 bump 解析「最新已发布 tag」永远钉旧 tgz：core CI 绿测的是
      # 本地新依赖集，发布物是旧依赖集，两套行为）。断言挂 pull_request 路径
      # （放 push = 漏网版本已进 main 才报，与 action pin 门禁同取舍）；
      # --selfcheck 先自证判据有牙齿（未抬版必红/同抬必绿/无关变更不误伤）。
      - name: package.json 变更必须同 PR 抬 VERSION（frontend-core#96）
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          bash scripts/check-version-bump.sh --selfcheck
          git fetch --quiet --no-tags origin "${BASE_SHA}"
          bash scripts/check-version-bump.sh "${BASE_SHA}" HEAD
      - name: 平台零容忍守卫(core 依赖清单不得出现任何宿主 SDK)
        run: |
          ! grep -qE '"@trimjs/|"@qnap|"@synology|"@ugreen|"@terramaster' package.json || {
            echo "::error::core 依赖清单出现宿主 SDK——平台代码属于壳仓,禁止进入 core"
            exit 1
          }
          ! grep -rqE "from '@trimjs|from \"@trimjs" src/ || {
            echo "::error::core 源码 import 了宿主 SDK——平台代码属于壳仓"
            exit 1
          }
      - name: 构建(先生成 components.d.ts 再全量类型检查)
        run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: neutral 产物平台代码扫描(命中即红)
        run: |
          if grep -rloE "trimjs|pickSharedFile|fnosSsoLogin|trim_open_gateway" dist/assets/ >/dev/null 2>&1; then
            echo "::error::neutral 构建产物出现平台代码"
            exit 1
          fi

  typecheck-latest:
    name: 类型检查（最新 vue-tsc，前瞻探针）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      # 2026-10-30 实录：frontend-core 以**源码 tgz** 被 fnos/openwrt/qnap 消费，
      # 三个平台的 `web/` 把 node_modules/@pigeonbox/frontend-core/src/** 一起纳入
      # 自己的 vue-tsc 类型检查 ⇒ **库的类型检查结论 = 消费方的类型检查结论**。
      # 本轮 vue-tsc 3.3.14 对 `<script setup>` 里 reactive() 绑定的 v-model 嵌套成员
      # 误生成 `.value` 访问（TS2339 ×20）⇒ 三个消费方 typecheck 全红、4.4.0 列车终验
      # 被挡；而库自己因为锁在 3.2.5 **CI 假绿** ⇒ 这类漂移永远由消费方先发现。
      # ⇒ 本 job 用**最新 vue-tsc** 跑一遍库自己的类型检查：上游工具链一出回归，
      #    **库这边先红**，而不是等消费方红（钉版只是止血，探针才是防线）。
      # ⚠️ typescript **钉在本仓地板**（6.0.3）：探针的信号要**只**来自 vue-tsc。
      #    若让它浮动，新地板的弃用项（如 baseUrl）会把信号淹在噪声里
      #    ——2026-10-30 首跑就踩到：npx 自带的 TS 6 报 TS5101（baseUrl 废弃），
      #    而那**不是**代码问题。本仓当时已顺手去掉 baseUrl（paths 改相对写法），
      #    所以 2026-11-02 地板抬到 TS 6.0.3 时**零改动**（frontend-core#40）。
      #    ⚠️ TS **7** 抬不动：typescript@7 是 Go 原生移植（无 JS 编译器 API），
      #    vue-tsc 3.3.x 直接崩 ⇒ 大版本只到 6.x，等 vue-tsc 支持再说。
      - name: 用最新 vue-tsc 跑类型检查（TS 钉本仓地板）
        run: npx --yes -p vue-tsc@latest -p typescript@6.0.3 vue-tsc --noEmit -p tsconfig.app.json

  e2e:
    name: 浏览器级 E2E（Playwright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      # 浏览器本体（含系统依赖）单独一步：Playwright 的浏览器不进 npm 依赖树，
      # 必须显式下载；`--with-deps` 补 ubuntu 上的共享库（否则 chromium 起不来，
      # 报错长在「缺 libnss3.so」而不是「少装浏览器」，很难一眼看出真因）。
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      # E2E 跑**构建产物**（vite preview）而不是 dev server：
      # base './' + hash 路由的发布形态才是用户拿到的形态，dev server 会掩盖
      # 产物级问题（资源路径、构建期注入的版本号等）。
      - name: 构建产物
        run: npx vite build
      - name: 跑浏览器级 E2E
        run: npx playwright test
      - name: 上传失败现场（trace + 截图）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 变异自证（pigeonbox#331）：判据有没有牙齿要**自证**——把被测行为故意改坏，
  # 对应 E2E 必须转红；变异后仍绿 = 判据是恒绿摆设。脚本自己做三件事：
  #   ① 锚点预检（漂移即红，点名「元测试需要更新」，不许静默放过）；
  #   ② 基线绿前置（未变异的 spec 本来就红 ⇒「变异转红」是假信号 ⇒ 判红中止）；
  #   ③ 每条变异：改坏 → 重建产物（vite build，产物陈旧 = 变异打不到浏览器）→
  #      跑对应 spec 必须转红 → 还原并逐字节校验。
  # ⚠️ 判据独立于 e2e job（不设 needs）：e2e 绿 ≠ 判据有牙齿，两条结论互不背书。
  # 取舍：当前 5 条变异全量跑（基线 4 spec + 每条变异一次构建 + 单 spec），
  #   本机实测 1m28s（CI runner 预计 5 分钟内），在 CI 预算内 ⇒ 不做采样；
  #   若日后变异点涨到跑不完，用 --only 采样（每条 spec 至少保留一个变异点）
  #   或挪定时/手动 workflow_dispatch。
  e2e-mutation:
    name: E2E 变异自证（判据牙齿复核）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 变异自证（基线绿 + 每条变异必须转红）
        run: python3 scripts/check-e2e-mutation.py
      - name: 上传失败现场（trace + 截图）
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-mutation-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
