name: Release

on:
  push:
    tags: ["v*"]
  # 手动 dispatch 兜底（库线 tag 人工打；若推 tag 未触发本工作流，手动指定
  # ref=目标 tag 重跑）；ref=目标 tag
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  source-tgz:
    # 源码包随 tag 发布到 Release——壳仓(frontend 等)以 Release 资产 URL 直接
    # 依赖(匿名 https,CI/本地构建免 git 免 registry,版本钉定与 tag 对齐;
    # 与 contracts 的 gen-ts tgz 同模式)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: 版本对齐(package.json.version ← tag)
        # 仅对齐本次 pack 用的版本号（保证 tgz 文件名与 tag 一致）；
        # 仓库里的 package.json version 须与发布 tag 手工保持同步
        # （库线先手打 tag，发布列车再消费该 tag），本步骤不回写仓库
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --no-workspaces-update --allow-same-version
      # ⚠️ 发布前**必跑构建**（2026-10-25 实录）：`npm pack` 只打包源码、**不编译
      # SFC**，所以「纯 CSS 的 <style> 块里写了双斜杠行注释」这类**只在编译期暴露**
      # 的错误会被原样打进 tgz ⇒ 壳仓构建炸（v0.11.24 实录：壳仓 CI 与本仓 CI
      # 双双红，坏 tgz 已发布）。⇒ 把构建放在发布**之前**当闸门：构建不过 ⇒
      # **不发 tgz**（不产出坏产物），失败也归因到正确的仓。
      - name: 发布前构建闸门（构建不过 ⇒ 不发 tgz）
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
      - name: Pack 源码包
        run: npm pack --pack-destination .
      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: pigeonbox-frontend-core-*.tgz
