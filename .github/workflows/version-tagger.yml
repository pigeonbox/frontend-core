name: Version Tagger
# 列车 bump PR(VERSION 变更)合并后自动打同号 tag——frontend-core 为库线独立
# semver(hub release/train.yaml lib.frontend-core),下游(fnos/qnap 的 web/ 与
# frontend 壳)以 Release tgz URL 钉版消费,不按 ref 检出。
# 门禁: 仅 commit message 以 "train:" 开头的 VERSION 变更才打 tag。
# 本仓无下游工作流,无跨仓写,GITHUB_TOKEN 即可(无需 PAT)。
on:
  push:
    branches: [main]
    paths: ["VERSION"]
permissions:
  contents: write
  actions: write
concurrency: version-tagger
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - name: 校验并打 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(git log -1 --format=%s)
          case "$MSG" in train:*) ;; *) echo "跳过:commit '${MSG}' 非列车 bump(仅 train: 前缀触发)"; exit 0;; esac
          VER=$(cat VERSION); TAG="v${VER}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then echo "tag ${TAG} 已存在,跳过"; exit 0; fi
          PV=$(grep -m1 '"version":' package.json | sed 's/[^0-9.]*//g')
          [ "$PV" = "$VER" ] || { echo "::error::package.json version=$PV ≠ VERSION=$VER——发版走 hub 列车 bump"; exit 1; }
          git config user.name "$GITHUB_ACTOR"; git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git tag "$TAG"; git push origin "refs/tags/${TAG}"
          # 1.16.1 列车实测:token 推 tag 不产生 push 事件,Release 静默不触发(0.1.9 人工补发)→
          # 显式 dispatch 兜底(与 push 触发幂等共存;ref=目标 tag,release 产物即该 tag 内容)
          gh workflow run release.yml --ref "$TAG" \
            || { echo "::error::Release dispatch 失败——断链不吞错,立即人工补救"; exit 1; }
          echo "✓ 已打 tag ${TAG} 并 dispatch Release(server/fnos/openwrt 构建将按此 ref 钉前端)"
